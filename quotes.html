<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotes — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:420px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.5rem;text-align:center}
h1{font-size:1.3rem;font-weight:900;margin-bottom:1rem}
blockquote{font-size:1.15rem;font-weight:700;line-height:1.5;margin-bottom:.8rem;min-height:4em}
.author{color:var(--muted);font-weight:600;margin-bottom:1.2rem}
.go{padding:12px 20px;border:3px solid var(--line);border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:900;box-shadow:var(--shadow-sm)}
.go:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Quotes</h1>
  <blockquote id="q">Loading…</blockquote>
  <p class="author" id="a"></p>
  <button class="go" id="next">Quote Baru</button>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

var Q=[
["The only way to do great work is to love what you do.","Steve Jobs"],
["Belajar tanpa berpikir sia-sia, berpikir tanpa belajar berbahaya.","Confucius"],
["Jangan takut gagal, takutlah tidak mencoba.","Anonim"],
["Code is like humor. When you have to explain it, it's bad.","Cory House"],
["Simplicity is the soul of efficiency.","Austin Freeman"],
["First, solve the problem. Then, write the code.","John Johnson"],
["Kerja keras mengalahkan bakat ketika bakat tidak bekerja keras.","Tim Notke"],
["Stay hungry, stay foolish.","Steve Jobs"]
];
function show(){var i=Math.floor(Math.random()*Q.length);document.getElementById("q").textContent='"'+Q[i][0]+'"';document.getElementById("a").textContent="— "+Q[i][1]}
document.getElementById("next").onclick=show;show();

</script>
</body>
</html>
