<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulator Mini — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:340px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.2rem}
h1{font-size:1.3rem;font-weight:900;margin-bottom:1rem;text-align:center}
.screen{background:var(--bg);border:3px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;text-align:right}
.expr{font-size:.8rem;color:var(--muted);min-height:1.2em;font-family:var(--mono);word-break:break-all}
.res{font-size:1.8rem;font-weight:900;font-family:var(--mono);word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:14px 0;font-weight:800;font-size:1.05rem;border:3px solid var(--line);border-radius:6px;background:var(--bg3);color:var(--ink);box-shadow:var(--shadow-sm);transition:.1s}
.keys button:active{transform:translate(2px,2px);box-shadow:none}
.keys button.op{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent)}
.keys button.eq{background:var(--accent);color:#fff}
.keys button.fn{background:color-mix(in srgb,#ff6b6b 15%,var(--surface));color:#e74c3c}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Kalkulator</h1>
  <div class="screen"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="keys" id="keys"></div>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

var expr="", res=document.getElementById("res"), ex=document.getElementById("expr");
var keys=["C","⌫","%","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","=","="];
var layout=["C","⌫","%","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","="];
var box=document.getElementById("keys");
layout.forEach(function(k){
  var b=document.createElement("button");b.textContent=k;
  if("/-*+".indexOf(k)>=0)b.className="op";
  if(k==="=")b.className="eq";
  if(k==="C"||k==="⌫")b.className="fn";
  if(k==="0")b.style.gridColumn="span 2";
  b.onclick=function(){press(k)};
  box.appendChild(b);
});
function press(k){
  if(k==="C"){expr="";res.textContent="0";ex.textContent="";return}
  if(k==="⌫"){expr=expr.slice(0,-1);ex.textContent=expr;return}
  if(k==="="){
    try{var v=Function('"use strict";return('+expr.replace(/%/g,"/100")+")")();
      res.textContent=String(Math.round(v*1e10)/1e10);ex.textContent=expr+" =";expr=String(v);
    }catch(e){res.textContent="Error";expr=""}
    return;
  }
  expr+=k;ex.textContent=expr;
}

</script>
</body>
</html>
