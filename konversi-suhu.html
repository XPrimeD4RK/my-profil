<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konversi Suhu — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:360px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.5rem}
h1{font-size:1.3rem;font-weight:900;margin-bottom:1rem;text-align:center}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:10px;color:var(--muted)}
input,select{width:100%;margin-top:4px;padding:10px;border:3px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.out{margin-top:1rem;padding:14px;border:3px solid var(--line);border-radius:var(--radius);background:var(--accent3);font-size:1.4rem;font-weight:900;text-align:center;font-family:var(--mono)}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Konversi Suhu</h1>
  <label>Nilai<input type="number" id="val" value="25" step="any"></label>
  <label>Dari
    <select id="from"><option value="c">Celsius</option><option value="f">Fahrenheit</option><option value="k">Kelvin</option></select>
  </label>
  <label>Ke
    <select id="to"><option value="f">Fahrenheit</option><option value="c">Celsius</option><option value="k">Kelvin</option></select>
  </label>
  <div class="out" id="out">—</div>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

function toC(v,u){if(u==="c")return v;if(u==="f")return(v-32)*5/9;return v-273.15}
function fromC(v,u){if(u==="c")return v;if(u==="f")return v*9/5+32;return v+273.15}
function calc(){
  var v=parseFloat(document.getElementById("val").value);if(isNaN(v)){document.getElementById("out").textContent="—";return}
  var r=fromC(toC(v,document.getElementById("from").value),document.getElementById("to").value);
  var unit={c:"°C",f:"°F",k:"K"}[document.getElementById("to").value];
  document.getElementById("out").textContent=(Math.round(r*100)/100)+" "+unit;
}
["val","from","to"].forEach(function(id){document.getElementById(id).oninput=calc;document.getElementById(id).onchange=calc});
calc();

</script>
</body>
</html>
