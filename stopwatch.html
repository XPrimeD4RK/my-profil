<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stopwatch — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:380px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.5rem;text-align:center}
h1{font-size:1.3rem;font-weight:900;margin-bottom:1rem}
.time{font-family:var(--mono);font-size:2.2rem;font-weight:900;letter-spacing:.04em;margin-bottom:1.2rem;padding:12px;border:3px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.b{padding:10px 16px;border:3px solid var(--line);border-radius:var(--radius);font-weight:800;background:var(--surface);box-shadow:var(--shadow-sm)}
.b:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.primary{background:var(--accent);color:#fff}
.b.danger{background:color-mix(in srgb,#e74c3c 20%,var(--surface));color:#c0392b}
.laps{list-style:none;margin-top:1rem;max-height:200px;overflow:auto;text-align:left}
.laps li{padding:8px 10px;border-bottom:2px solid var(--line);font-family:var(--mono);font-weight:700;font-size:.9rem;display:flex;justify-content:space-between}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Stopwatch</h1>
  <div class="time" id="time">00:00:00.00</div>
  <div class="row">
    <button id="start" class="b primary">Start</button>
    <button id="lap" class="b" disabled>Lap</button>
    <button id="reset" class="b danger">Reset</button>
  </div>
  <ul class="laps" id="laps"></ul>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

var t0=0,acc=0,timer=null,running=false,laps=[];
function fmt(ms){var m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+":"+String(cs).padStart(2,"0")}
function tick(){document.getElementById("time").textContent=fmt(acc+(Date.now()-t0))}
document.getElementById("start").onclick=function(){
  if(!running){t0=Date.now();timer=setInterval(tick,10);running=true;this.textContent="Pause";document.getElementById("lap").disabled=false}
  else{acc+=Date.now()-t0;clearInterval(timer);running=false;this.textContent="Start";document.getElementById("lap").disabled=true}
};
document.getElementById("lap").onclick=function(){
  if(!running)return;var v=acc+(Date.now()-t0);laps.unshift(v);
  var ul=document.getElementById("laps");ul.innerHTML=laps.map(function(x,i){return "<li><span>Lap "+(laps.length-i)+"</span><span>"+fmt(x)+"</span></li>"}).join("");
};
document.getElementById("reset").onclick=function(){
  clearInterval(timer);running=false;acc=0;laps=[];t0=0;
  document.getElementById("time").textContent="00:00:00.00";
  document.getElementById("start").textContent="Start";
  document.getElementById("lap").disabled=true;
  document.getElementById("laps").innerHTML="";
};

</script>
</body>
</html>
