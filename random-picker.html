<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Picker — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:400px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.5rem}
h1{font-size:1.3rem;font-weight:900;margin-bottom:1rem;text-align:center}
textarea{width:100%;padding:12px;border:3px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;margin-bottom:12px;resize:vertical}
.go{width:100%;padding:12px;border:3px solid var(--line);border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:900;box-shadow:var(--shadow-sm);margin-bottom:12px}
.go:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.out{padding:14px;border:3px solid var(--line);border-radius:var(--radius);background:var(--accent3);font-size:1.2rem;font-weight:900;text-align:center;min-height:1.5em}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Random Picker</h1>
  <textarea id="list" rows="6" placeholder="Satu item per baris…"></textarea>
  <button class="go" id="pick">Pilih Acak</button>
  <div class="out" id="out">—</div>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

document.getElementById("pick").onclick=function(){
  var items=document.getElementById("list").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(!items.length){document.getElementById("out").textContent="Isi daftar dulu";return}
  document.getElementById("out").textContent=items[Math.floor(Math.random()*items.length)];
};

</script>
</body>
</html>
