<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tebak Angka — xs0ciety</title>
<link rel="stylesheet" href="ui/style.css">
<link rel="icon" href="img/foto-profil.jpg">
<script>(function(){var s=localStorage.getItem("xs-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
<style>

.box{width:100%;max-width:360px;background:var(--surface);border:3px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:1.5rem;text-align:center}
h1{font-size:1.4rem;font-weight:900;margin-bottom:.5rem}
.hint{color:var(--muted);font-weight:600;margin-bottom:1rem;min-height:1.4em}
input{width:100%;padding:12px;border:3px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;text-align:center;margin-bottom:12px;font-size:1.1rem}
.go{width:100%;padding:12px;border:3px solid var(--line);border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:900;box-shadow:var(--shadow-sm)}
.go:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.go.secondary{background:var(--accent3);color:var(--ink)}
.stat{margin-top:12px;font-weight:700;color:var(--muted);font-size:.9rem}

</style>
</head>
<body>
<a class="back-link" href="index.html">← Kembali</a>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
</button>
<div class="page-wrapper">

<div class="box">
  <h1>Tebak Angka</h1>
  <p class="hint" id="hint">Tebak angka 1 – 1000</p>
  <input type="number" id="guess" min="1" max="1000" placeholder="Masukkan tebakan…">
  <button class="go" id="go">Tebak</button>
  <p class="stat" id="stat">Percobaan: 0</p>
  <button class="go secondary" id="reset" style="display:none;margin-top:10px">Main Lagi</button>
</div>

</div>
<script>
document.getElementById("theme-toggle").onclick=function(){
  var r=document.documentElement,t=r.getAttribute("data-theme")==="dark"?"light":"dark";
  r.setAttribute("data-theme",t);try{localStorage.setItem("xs-theme",t)}catch(e){}
};

var secret=0,tries=0;
function newGame(){secret=Math.floor(Math.random()*1000)+1;tries=0;document.getElementById("hint").textContent="Tebak angka 1 – 1000";document.getElementById("stat").textContent="Percobaan: 0";document.getElementById("guess").value="";document.getElementById("guess").disabled=false;document.getElementById("go").style.display="block";document.getElementById("reset").style.display="none"}
document.getElementById("go").onclick=function(){
  var g=+document.getElementById("guess").value;if(!g||g<1||g>1000){document.getElementById("hint").textContent="Masukkan 1–1000";return}
  tries++;document.getElementById("stat").textContent="Percobaan: "+tries;
  if(g===secret){document.getElementById("hint").textContent="Benar! Angkanya "+secret;document.getElementById("guess").disabled=true;document.getElementById("go").style.display="none";document.getElementById("reset").style.display="block"}
  else if(g<secret)document.getElementById("hint").textContent="Terlalu kecil ↑";
  else document.getElementById("hint").textContent="Terlalu besar ↓";
};
document.getElementById("reset").onclick=newGame;
document.getElementById("guess").onkeydown=function(e){if(e.key==="Enter")document.getElementById("go").click()};
newGame();

</script>
</body>
</html>
